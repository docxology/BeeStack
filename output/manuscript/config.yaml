paper:
  title: "BeeStack: An Evidence-Typed Scaffold for Whole-Colony Honeybee Simulation"
  subtitle: "A Body–Brain–Mind–Swarm–Niche Substrate for Auditable Apis mellifera Modeling"
  version: "0.2"
  date: "May 2026"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "danielarifriedman@gmail.com"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  doi: ""
  journal: ""
  year: "2026"

keywords:
  - "honeybee"
  - "Apis mellifera"
  - "active inference"
  - "simulation scaffold"
  - "swarm intelligence"
  - "niche construction"
