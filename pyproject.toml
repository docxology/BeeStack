# BeeStack project configuration.

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beestack"
version = "0.1.0"
description = "Template-compliant BeeStack digital-twin scaffold for honeybee colony simulation"
authors = [
    {name = "Daniel Ari Friedman"},
]
requires-python = ">=3.11"
dependencies = [
    "flybody @ git+https://github.com/TuragaLab/flybody.git",
    "h5py>=3.16.0",
    "matplotlib>=3.8.0",
    "networkx>=3.6.1",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.3.3",
    "pillow>=10.0.0",
    "plotly>=6.7.0",
    "pyyaml>=6.0.1",
    "scikit-image>=0.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
beestack-analysis = "beestack.cli:main"
beestack-animations = "beestack.cli:animations_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/cli.py"]

[tool.coverage.report]
fail_under = 92
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.uv]
